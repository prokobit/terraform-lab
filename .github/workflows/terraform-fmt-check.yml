name: "Terraform Formatting Check"
on: [push]
jobs:
  terraform:
    name: "Terraform Formatting Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Formating Check
        run: | 
          terraform fmt -recursive -check -diff
